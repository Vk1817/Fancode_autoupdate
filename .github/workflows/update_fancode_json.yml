name: Update Fancode JSON & M3U

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes — same as drmlive source cadence
  workflow_dispatch:          # Manual trigger from Actions tab

permissions:
  contents: write             # Required to push commits back to repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🔄 Run Update Script
        run: python update_fancode.py

      - name: 💾 Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pranav.json fancode.m3u
          git diff --cached --quiet || git commit -m "🔄 Auto-update: pranav.json & fancode.m3u [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
